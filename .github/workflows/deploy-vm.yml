name: Deploy Football Auction League to Oracle VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: football-league-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP=/var/www/football-league-app
          REPO=https://github.com/Irvix11/football-league.git
          DOMAIN=footballleague.runs-on.dev

          if ! command -v node >/dev/null 2>&1 || [ "$(node -v | sed "s/^v//" | cut -d. -f1)" -lt 24 ]; then
            curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
            sudo apt-get update
            sudo apt-get install -y nodejs git
          elif ! command -v git >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git
          fi

          if [ ! -d "$APP/.git" ]; then
            sudo mkdir -p "$APP"
            sudo chown "$USER":"$USER" "$APP"
            git clone "$REPO" "$APP"
          fi

          cd "$APP"
          git fetch origin main
          git reset --hard origin/main
          # Dependencies are disposable on the authoritative VM. Remove the
          # previous tree to avoid npm ENOTEMPTY after interrupted installs.
          rm -rf node_modules
          rm -rf "$HOME/.npm/_cacache"
          npm ci --prefer-online
          node scripts/check-deps.mjs
          npm run lint
          npm audit --audit-level=high
          npm run smoke
          VITE_GAME_SERVER_URL=https://footballleague.runs-on.dev npm run build

          sudo tee /etc/systemd/system/football-league.service >/dev/null <<'UNIT'
          [Unit]
          Description=Football Auction League realtime game server
          After=network.target

          [Service]
          Type=simple
          User=__DEPLOY_USER__
          WorkingDirectory=/var/www/football-league-app
          Environment=NODE_ENV=production
          Environment=PORT=3000
          Environment=SERVER_HOST=127.0.0.1
          ExecStart=/usr/bin/node /var/www/football-league-app/node_modules/tsx/dist/cli.mjs server.ts
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectHome=true
          ProtectSystem=full
          UMask=027
          LimitNOFILE=65535

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo sed -i "s/__DEPLOY_USER__/$USER/g" /etc/systemd/system/football-league.service
          sudo systemctl daemon-reload
          sudo systemctl enable football-league
          sudo systemctl restart football-league

          echo "Waiting for realtime server..."
          health_ok=0
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              health_ok=1
              break
            fi
            sleep 1
          done

          if [ "$health_ok" -ne 1 ]; then
            echo "=== football-league service status ==="
            sudo systemctl status football-league --no-pager || true
            echo "=== football-league journal ==="
            sudo journalctl -u football-league -n 120 --no-pager || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:3000/api/health
          echo

          # Install Certbot once. The certificate is issued on the VM so the
          # Oracle-hosted origin terminates TLS itself; runs-on.dev only supplies DNS.
          if ! command -v certbot >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y certbot python3-certbot-nginx
          fi

          # DNS must point at this VM before Let's Encrypt can validate the hostname.
          resolved_ip="$(getent ahostsv4 "$DOMAIN" | awk 'NR==1 {print $1}')"
          if [ "$resolved_ip" != "140.245.195.89" ]; then
            echo "DNS for $DOMAIN is not pointing at this Oracle VM yet."
            echo "Resolved: ${resolved_ip:-<none>}"
            exit 1
          fi

          # Temporary HTTP-only Nginx config used for the ACME HTTP-01 challenge.
          sudo tee /etc/nginx/sites-available/football-league >/dev/null <<'NGINX'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name footballleague.runs-on.dev _;

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 86400;
              }
          }
          NGINX

          sudo ln -sf /etc/nginx/sites-available/football-league /etc/nginx/sites-enabled/football-league
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl reload nginx

          if [ ! -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
            sudo certbot certonly --nginx               -d "$DOMAIN"               --non-interactive               --agree-tos               --register-unsafely-without-email
          else
            sudo certbot renew --quiet
          fi

          # Permanent HTTPS + WebSocket proxy configuration.
          sudo tee /etc/nginx/sites-available/football-league >/dev/null <<'NGINX'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name footballleague.runs-on.dev _;

              location /.well-known/acme-challenge/ {
                  root /var/www/football-league-app;
              }

              location / {
                  return 301 https://footballleague.runs-on.dev$request_uri;
              }
          }

          server {
              listen 443 ssl;
              listen [::]:443 ssl;
              server_name footballleague.runs-on.dev;

              ssl_certificate /etc/letsencrypt/live/footballleague.runs-on.dev/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/footballleague.runs-on.dev/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_session_timeout 1d;
              ssl_session_cache shared:SSL:10m;
              ssl_session_tickets off;

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 86400;
              }
          }
          NGINX

          sudo nginx -t
          sudo systemctl restart nginx

          # Verify that Nginx actually bound HTTPS before declaring the deployment successful.
          # Force IPv4 because --resolve alone can still prefer the IPv6 listener on some hosts.
          if ! sudo ss -lntp | grep -Eq 'LISTEN[[:space:]].*:443([[:space:]]|$)'; then
            echo "Nginx is not listening on TCP port 443 after restart."
            sudo systemctl status nginx --no-pager || true
            sudo journalctl -u nginx -n 80 --no-pager || true
            exit 1
          fi

          # Verify HTTPS locally on the VM without relying on public-IP hairpin routing.
          curl -4 -fsS --connect-timeout 10 --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/api/health"
          echo

          echo "Deployment successful: https://$DOMAIN"
          REMOTE

          rm -f ~/.ssh/deploy_key
