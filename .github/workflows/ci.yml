name: CI

on:
  push:
    branches: [main, fix/full-review]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:full
      - run: npm run smoke
      - run: npm test
      - run: npm audit --audit-level=high
