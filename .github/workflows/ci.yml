name: CI

on:
  push:
    branches: [main, fix/full-review]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:full
      - run: npm run smoke
      - run: npm test
      - run: npm audit --audit-level=high

  deploy-oracle:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/full-review')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="$(find "$HOME" -maxdepth 5 -type d -name football-league -print -quit)"
            if [ -z "$APP_DIR" ]; then
              echo "football-league checkout not found under $HOME"
              exit 1
            fi
            cd "$APP_DIR"
            git fetch origin
            git reset --hard
            git clean -fd -e .env -e '.env.*'
            git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
            # Dependencies are disposable on the authoritative VM. Removing the
            # previous tree avoids npm ENOTEMPTY failures after interrupted installs.
            rm -rf node_modules
            npm cache clean --force
            npm ci --prefer-online
            node scripts/check-deps.mjs
            npm run build:full
            if command -v pm2 >/dev/null 2>&1 && pm2 describe football-auction-league >/dev/null 2>&1; then
              pm2 restart football-auction-league --update-env
              pm2 status football-auction-league
            elif command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files | grep -q '^football-league\.service'; then
              sudo systemctl restart football-league
              sudo systemctl is-active --quiet football-league
            else
              echo "No supported Football Auction League process manager was found."
              echo "Expected PM2 process 'football-auction-league' or systemd unit 'football-league.service'."
              exit 1
            fi
            sleep 3
