name: CI

on:
  push:
    branches: [main, fix/full-review]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:full
      - run: npm run smoke
      - run: npm test
      - run: npm audit --audit-level=high

  deploy-oracle:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/full-review')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="$(find "$HOME" -maxdepth 5 -type d -name football-league -print -quit)"
            if [ -z "$APP_DIR" ]; then
              echo "football-league checkout not found under $HOME"
              exit 1
            fi
            cd "$APP_DIR"
            git fetch origin
            git reset --hard
            git clean -fd -e .env -e '.env.*'
            git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
            npm ci
            npm run build:full
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart football-auction-league --update-env
              pm2 status football-auction-league
            else
              sudo systemctl restart football-league
              sudo systemctl is-active --quiet football-league
            fi
            sleep 3
